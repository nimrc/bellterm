[package]
description            = "Bellterm's Android core: SSH bridge, libghostty-vt screen, and JNI surface"
edition.workspace      = true
license.workspace      = true
name                   = "bellterm"
publish.workspace      = true
rust-version.workspace = true
version.workspace      = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
base64            = { workspace = true }
crossbeam-channel = { workspace = true }
getrandom         = "0.4.3"
herdr-client      = { workspace = true }
jni               = { default-features = false, version = "0.22.4" }
# Pinned: the C API is unstable, and this release pins the Ghostty commit
# (and so the Zig version, 0.15.2) it builds.
libghostty-vt     = "=0.2.2"
russh             = { default-features = false, features = ["flate2", "ring", "rsa"], version = "=0.64.1" }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tokio             = { features = ["io-util", "net", "rt", "time"], version = "1" }
tracing           = { workspace = true }
unicode-width     = "0.2.2"
zeroize           = { features = ["serde"], version = "=1.9.1" }

[target.'cfg(target_os = "android")'.dependencies]
# Routes `tracing` events, including herdr-client's, to logcat.
paranoid-android   = "0.2"
tracing-subscriber = { default-features = false, features = ["registry", "std"], version = "0.3" }

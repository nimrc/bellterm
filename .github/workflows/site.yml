name: Site

# bellterm.app is deployed from main only, so what it serves is always a
# commit. Pull requests check the Worker config and assets without deploying.
on:
  push:
    branches: [main]
    paths: [site/**, wrangler.jsonc]
  pull_request:
    paths: [site/**, wrangler.jsonc, .github/workflows/site.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: bellterm.app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check
        if: github.event_name == 'pull_request'
        run: npx --yes wrangler@4.151.1 deploy --dry-run

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 deploy

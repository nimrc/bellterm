name: Release

# Pushing a tag v<versionName> builds the signed release APK and the update
# manifest, and attaches both to a GitHub release. Copy the two files from the
# release to https://dl.bellterm.app/ to publish them; the app's update check
# reads latest.json there.
#
# Secrets: BELLTERM_KEYSTORE_BASE64 (the release keystore, base64-encoded),
# BELLTERM_KEYSTORE_PASSWORD, BELLTERM_KEY_ALIAS, and BELLTERM_KEY_PASSWORD if
# it differs from the keystore password. Release notes come from
# release-notes/<versionName>.en.txt and .zh.txt when present.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Signed APK and update manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # Must match app/build.gradle.kts.
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.BELLTERM_KEYSTORE_BASE64 }}
          BELLTERM_KEYSTORE_PASSWORD: ${{ secrets.BELLTERM_KEYSTORE_PASSWORD }}
          BELLTERM_KEY_ALIAS: ${{ secrets.BELLTERM_KEY_ALIAS }}
          BELLTERM_KEY_PASSWORD: ${{ secrets.BELLTERM_KEY_PASSWORD }}
        run: |
          export BELLTERM_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$BELLTERM_KEYSTORE"
          ./gradlew --console=plain assembleRelease
          rm -f "$BELLTERM_KEYSTORE"

      - name: Write the update manifest
        run: |
          notes() { [ -f "release-notes/$VERSION.$1.txt" ] && echo "release-notes/$VERSION.$1.txt" || echo ""; }
          scripts/release-manifest.sh app/build/outputs/apk/release/app-release.apk dist "$(notes en)" "$(notes zh)"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Bellterm $VERSION" --notes-file <(cat "release-notes/$VERSION.en.txt" 2>/dev/null || echo "Bellterm $VERSION")

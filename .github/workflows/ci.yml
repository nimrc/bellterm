name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Rust core, unit tests, APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Must match app/build.gradle.kts.
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # libghostty-vt-sys builds Ghostty with Zig; its pinned commit needs 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the version, components, and Android targets.
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked

      # Built with the step above; the Windows host job runs it in WSL.
      - name: Live SSH test binary
        run: |
          cargo test --workspace --locked --no-run --message-format=json \
            | jq -r 'select(.target.name == "live_ssh" and .executable != null) | .executable' \
            | xargs -I{} cp {} live_ssh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-ssh
          path: live_ssh
          if-no-files-found: error
          retention-days: 1

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests and APKs
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bellterm-apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 14

  # Issue #25: a Windows OpenSSH host runs cmd.exe or PowerShell, never
  # /bin/sh. A fresh local user without Herdr goes through the app's flow:
  # install prompt, install over SSH, attach, update, attach.
  windows-host:
    name: Windows OpenSSH host (${{ matrix.shell }})
    needs: android
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [cmd, powershell]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-ssh
          path: live

      # WSL 1 shares the runner's network stack, so 127.0.0.1:22 is sshd.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          additional-packages: sshpass openssh-client

      - name: OpenSSH Server and a user without Herdr
        shell: powershell
        env:
          DEFAULT_SHELL: ${{ matrix.shell }}
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          New-Item -Path HKLM:\SOFTWARE\OpenSSH -Force | Out-Null
          if ($env:DEFAULT_SHELL -eq 'powershell') {
            New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -PropertyType String -Force `
              -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" | Out-Null
          }
          Start-Service sshd
          # The runner image limits sshd to its own groups.
          $config = "$env:ProgramData\ssh\sshd_config"
          (Get-Content $config) | Where-Object { $_ -notmatch '^\s*(AllowGroups|AllowUsers)\b' } | Set-Content -Encoding ascii $config
          Get-Content $config | Where-Object { $_ -match '^\s*[^#\s]' }
          Restart-Service sshd
          $password = 'Bt-' + [guid]::NewGuid().ToString('N') + '-x1A'
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name bellterm -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member bellterm
          # Windows PowerShell's Out-File would write a BOM.
          [IO.File]::AppendAllText($env:GITHUB_ENV, "BELLTERM_LIVE_PASSWORD=$password`n")

      - name: Install Herdr over SSH, then attach
        shell: wsl-bash {0}
        env:
          BELLTERM_LIVE_HOST: 127.0.0.1
          BELLTERM_LIVE_PORT: '22'
          BELLTERM_LIVE_USER: bellterm
          WSLENV: BELLTERM_LIVE_HOST:BELLTERM_LIVE_PORT:BELLTERM_LIVE_USER:BELLTERM_LIVE_PASSWORD
        run: |
          chmod +x live/live_ssh
          RUST_BACKTRACE=1 live/live_ssh --ignored --nocapture --exact installs_herdr_then_attaches

      - name: Herdr on the host
        if: failure()
        shell: wsl-bash {0}
        env:
          SSHPASS: ${{ env.BELLTERM_LIVE_PASSWORD }}
          WSLENV: SSHPASS
        run: |
          on_host() { sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null bellterm@127.0.0.1 "$1" || true; }
          for command in 'where.exe herdr.exe' 'herdr.exe --version' 'herdr.exe status client --json' 'herdr.exe --session default status server --json'; do
            echo "== $command"; on_host "$command"
          done
          on_host 'powershell -NoProfile -Command "Get-ChildItem -Recurse -Force $env:USERPROFILE\.herdr, $env:LOCALAPPDATA\herdr -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName"'
          on_host 'powershell -NoProfile -Command "Get-ChildItem -Recurse -Force -Include *.log $env:USERPROFILE\.herdr, $env:LOCALAPPDATA\herdr, $env:APPDATA\herdr -ErrorAction SilentlyContinue | ForEach-Object { \"== $_\"; Get-Content -Tail 80 $_ }"'
          echo '== bridge by hand'
          timeout 20 sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null bellterm@127.0.0.1 'herdr.exe --session default remote-client-bridge' </dev/null | head -c 2000 | od -c | head -20 || true

      - name: sshd log
        if: failure()
        shell: powershell
        run: Get-WinEvent -LogName OpenSSH/Operational -MaxEvents 60 -ErrorAction SilentlyContinue | Sort-Object TimeCreated | Format-Table -AutoSize -Wrap TimeCreated, Message

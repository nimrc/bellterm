name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Rust core, unit tests, APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Must match app/build.gradle.kts.
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      # libghostty-vt-sys builds Ghostty with Zig; its pinned commit needs 0.15.2.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # rust-toolchain.toml pins the version, components, and Android targets.
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Rust workspace
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo test --workspace --locked

      # Built with the step above; the Windows host job runs it in WSL.
      - name: Live SSH test binary
        run: |
          cargo test --workspace --locked --no-run --message-format=json \
            | jq -r 'select(.target.name == "live_ssh" and .executable != null) | .executable' \
            | xargs -I{} cp {} live_ssh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-ssh
          path: live_ssh
          if-no-files-found: error
          retention-days: 1

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests and APKs
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease

      # The release workflow builds this for Google Play; it must not check
      # dl.bellterm.app for updates.
      - name: Play bundle
        run: |
          ./gradlew --console=plain -Pbellterm.play=true bundleRelease
          grep -q 'UPDATE_CHECK = false' app/build/generated/source/buildConfig/release/app/bellterm/BuildConfig.java

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bellterm-apks
          path: |
            app/build/outputs/apk/*/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Issue #29: Herdr's own client switches to the machines its host saved with
  # `herdr machine add`; Bellterm lists them and attaches through the host's
  # ssh. Host and machine are two Herdr sessions behind one local sshd.
  saved-machine:
    name: Saved machine through its host
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-ssh
          path: live

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bellterm-apks
          path: apks

      - name: sshd, Herdr, and a saved machine
        run: |
          [ -x /usr/sbin/sshd ] || sudo apt-get install -y openssh-server > /dev/null
          sudo mkdir -p /run/sshd
          mkdir -p ~/.ssh ~/sshd && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/sshd/host
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          ssh-keygen -q -t ed25519 -N '' -f ~/bellterm-key
          cat ~/.ssh/id_ed25519.pub ~/bellterm-key.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          printf '%s\n' 'Port 2222' 'ListenAddress 127.0.0.1' "HostKey $HOME/sshd/host" \
            "PidFile $HOME/sshd/pid" 'UsePAM no' 'PasswordAuthentication no' 'StrictModes no' > ~/sshd/config
          /usr/sbin/sshd -f ~/sshd/config -E ~/sshd/log
          ssh-keyscan -p 2222 -t ed25519 127.0.0.1 >> ~/.ssh/known_hosts 2> /dev/null
          curl -fsSL https://herdr.dev/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          herdr machine add "ssh://$(id -un)@127.0.0.1:2222" --remote-session machine --label b-machine < /dev/null
          herdr --session machine workspace create --label on-b --no-focus
          herdr machine list --json
          # The host's own session, which the app attaches to first.
          nohup herdr server > ~/herdr-host.log 2>&1 &
          for _ in $(seq 30); do herdr status server --json | grep -q '"running":true' && break; sleep 1; done
          echo "FINGERPRINT=$(ssh-keygen -lf ~/sshd/host.pub | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: List the machine and attach through its host
        run: |
          export BELLTERM_LIVE_HOST=127.0.0.1 BELLTERM_LIVE_PORT=2222 BELLTERM_LIVE_USER="$(id -un)"
          export BELLTERM_LIVE_KEY="$HOME/bellterm-key"
          export BELLTERM_LIVE_MACHINE=b-machine BELLTERM_LIVE_MACHINE_WORKSPACE=on-b
          chmod +x live/live_ssh
          RUST_BACKTRACE=1 live/live_ssh --ignored --nocapture --exact attaches_to_a_saved_machine_through_its_host

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The app itself on an emulator, which reaches the runner's sshd as
      # 10.0.2.2: the drawer lists the machine, and switching to it attaches.
      - name: Emulator script
        run: |
          cat > "$RUNNER_TEMP/emulator.sh" <<'SCRIPT'
          set -u
          trap 'adb pull /sdcard/Android/data/app.bellterm/files/e2e "$RUNNER_TEMP/screens" > /dev/null' EXIT
          adb install -r -g apks/debug/app-debug.apk
          adb install -r -g apks/androidTest/debug/app-debug-androidTest.apk
          # am instrument exits 0 on failures, and a skipped test (code -4) still
          # reads OK, so both are checked in its output.
          instrument() {
            adb shell am instrument -w -r "$@" app.bellterm.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/instrument.log"
            cat "$RUNNER_TEMP/instrument.log"
            grep -q '^OK (' "$RUNNER_TEMP/instrument.log" && ! grep -q 'INSTRUMENTATION_STATUS_CODE: -4' "$RUNNER_TEMP/instrument.log"
          }
          test=app.bellterm.e2e.GlassUiTest
          instrument -e publish_key 1 -e class "$test#t0_publishesDeviceKey" || exit 1
          adb shell cat /sdcard/Android/data/app.bellterm/files/e2e/device.pub >> ~/.ssh/authorized_keys
          instrument -e host 10.0.2.2 -e port 2222 -e user "$(id -un)" -e fingerprint "$FINGERPRINT" \
            -e machine b-machine -e machine_workspace on-b -e class "$test#t8_switchesToSavedMachine,$test#t9_changelogListsReleases,$test#t10_shiftLatchesForTheNextKey"
          SCRIPT

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash "$RUNNER_TEMP/emulator.sh"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: saved-machine-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14

      - name: sshd and Herdr state
        if: failure()
        run: |
          cat ~/sshd/log || true
          cat ~/herdr-host.log || true
          PATH="$HOME/.local/bin:$PATH" herdr machine status --json || true

  # Issue #25: a Windows OpenSSH host runs cmd.exe or PowerShell, never
  # /bin/sh. A fresh admin user without Herdr goes through the app's flow:
  # install prompt, install over SSH, attach, update, attach.
  windows-host:
    name: Windows OpenSSH host (${{ matrix.shell }})
    needs: android
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shell: [cmd, powershell]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-ssh
          path: live

      # WSL 1 shares the runner's network stack, so 127.0.0.1:22 is sshd.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1
          additional-packages: sshpass openssh-client

      - name: OpenSSH Server and a user without Herdr
        shell: powershell
        env:
          DEFAULT_SHELL: ${{ matrix.shell }}
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          New-Item -Path HKLM:\SOFTWARE\OpenSSH -Force | Out-Null
          if ($env:DEFAULT_SHELL -eq 'powershell') {
            New-ItemProperty -Path HKLM:\SOFTWARE\OpenSSH -Name DefaultShell -PropertyType String -Force `
              -Value "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" | Out-Null
          }
          Start-Service sshd
          # The runner image limits sshd to its own groups.
          $config = "$env:ProgramData\ssh\sshd_config"
          (Get-Content $config) | Where-Object { $_ -notmatch '^\s*(AllowGroups|AllowUsers)\b' } | Set-Content -Encoding ascii $config
          Get-Content $config | Where-Object { $_ -match '^\s*[^#\s]' }
          Restart-Service sshd
          $password = 'Bt-' + [guid]::NewGuid().ToString('N') + '-x1A'
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name bellterm -Password $secure -PasswordNeverExpires | Out-Null
          # Herdr starts its Windows server through WMI, which a non-admin
          # SSH logon may not use (0x80041003).
          Add-LocalGroupMember -Group Administrators -Member bellterm
          # Windows PowerShell's Out-File would write a BOM.
          [IO.File]::AppendAllText($env:GITHUB_ENV, "BELLTERM_LIVE_PASSWORD=$password`n")

      - name: Install Herdr over SSH, then attach
        shell: wsl-bash {0}
        env:
          BELLTERM_LIVE_HOST: 127.0.0.1
          BELLTERM_LIVE_PORT: '22'
          BELLTERM_LIVE_USER: bellterm
          WSLENV: BELLTERM_LIVE_HOST:BELLTERM_LIVE_PORT:BELLTERM_LIVE_USER:BELLTERM_LIVE_PASSWORD
        run: |
          chmod +x live/live_ssh
          RUST_BACKTRACE=1 live/live_ssh --ignored --nocapture --exact installs_herdr_then_attaches

      - name: Herdr on the host
        if: failure()
        shell: wsl-bash {0}
        env:
          SSHPASS: ${{ env.BELLTERM_LIVE_PASSWORD }}
          WSLENV: SSHPASS
        run: |
          on_host() { sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null bellterm@127.0.0.1 "$1" || true; }
          for command in 'where.exe herdr.exe' 'herdr.exe --version' 'herdr.exe status client --json' 'herdr.exe --session default status server --json'; do
            echo "== $command"; on_host "$command"
          done
          on_host 'powershell -NoProfile -Command "Get-ChildItem -Recurse -Force $env:USERPROFILE\.herdr, $env:LOCALAPPDATA\herdr -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName"'
          on_host 'powershell -NoProfile -Command "Get-ChildItem -Recurse -Force -Include *.log $env:USERPROFILE\.herdr, $env:LOCALAPPDATA\herdr, $env:APPDATA\herdr -ErrorAction SilentlyContinue | ForEach-Object { \"== $_\"; Get-Content -Tail 80 $_ }"'
          echo '== bridge by hand'
          timeout 20 sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null bellterm@127.0.0.1 'herdr.exe --session default remote-client-bridge' </dev/null | head -c 2000 | od -c | head -20 || true

      - name: sshd log
        if: failure()
        shell: powershell
        run: Get-WinEvent -LogName OpenSSH/Operational -MaxEvents 60 -ErrorAction SilentlyContinue | Sort-Object TimeCreated | Format-Table -AutoSize -Wrap TimeCreated, Message
